version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowtrace-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/flowtrace.db  # on the flowtrace-db volume, so it survives rebuilds
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - INGEST_API_KEY=${INGEST_API_KEY:-}  # unset: writes refused (503); see backend/auth.py
      - READ_API_KEY=${READ_API_KEY:-}
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
    volumes:
      - flowtrace-db:/app/data
    depends_on:
      - mosquitto
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # baked into the JS bundle (anyone who loads the dashboard can read it); same value as the backend's READ_API_KEY
        VITE_READ_API_KEY: ${READ_API_KEY:-}
    container_name: flowtrace-dashboard
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: flowtrace-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

volumes:
  flowtrace-db:
  mosquitto-data:
