version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: flowtrace_mqtt
    entrypoint: ["/bin/sh", "/docker/mosquitto-entrypoint.sh"]
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME:-flowtrace}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?set MQTT_PASSWORD in .env (the broker refuses anonymous clients)}
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto-entrypoint.sh:/docker/mosquitto-entrypoint.sh:ro
      - mosquitto_data:/mosquitto/data
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: flowtrace/backend:latest
    container_name: flowtrace_api
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/flowtrace.db
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME:-flowtrace}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?set MQTT_PASSWORD in .env (the broker refuses anonymous clients)}
    volumes:
      - app_data:/app/data
    depends_on:
      - mosquitto
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mosquitto_data:
  app_data:
