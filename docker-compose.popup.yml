version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: flowtrace_mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: flowtrace/backend:latest
    container_name: flowtrace_api
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/flowtrace.db
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    volumes:
      - app_data:/app/data
    depends_on:
      - mosquitto
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mosquitto_data:
  app_data:
