version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: flowtrace_mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: flowtrace/backend:latest
    container_name: flowtrace_api
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/flowtrace.db
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - INGEST_API_KEY=${INGEST_API_KEY:?Set INGEST_API_KEY before starting the popup stack}
    volumes:
      - app_data:/app/data
    depends_on:
      - mosquitto
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mosquitto_data:
  app_data:
